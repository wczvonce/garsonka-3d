<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e9e4dc">
<title>Garsónka 360°</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e4dc; font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2329; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 26px 10px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; background: linear-gradient(transparent, rgba(30,28,25,.42)); }
  #bar::-webkit-scrollbar { display: none; }
  button, a.btn { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; box-sizing: border-box; border: 1px solid rgba(255,255,255,.75); border-radius: 22px; background: rgba(255,255,255,.92); color: inherit; font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  button.on { background: #1d2329; border-color: #1d2329; color: #fff; }
  #hint { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; font-size: 13px; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.7); pointer-events: none; transition: opacity .4s; }
  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 18px; background: rgba(29,35,41,.78); color: #fff; font-size: 14px; pointer-events: none; text-align: center; max-width: 80vw; }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="hint">Ťahaj prstom a rozhliadaj sa, dvoma prstami približuj. Biele kruhy na podlahe ťa prenesú na iné miesto.</div>
<div id="status">Načítavam fotku…</div>
<nav id="bar" aria-label="Miesta v byte"></nav>

<script type="importmap">
{ "imports": { "three": "./lib/three/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const VERSION = '2026-11-03';
const EYE_FLOOR = 0;

// Polohy kamier z renderu v metroch: x od ľavej steny, y od nízkej steny, z od podlahy.
const SPOTS = {
  koberec: { name: 'Obývačka', pos: [3.75, 1.35, 1.15], look: [5.45, 2.95], links: ['stred', 'gauc', 'vstup'] },
  stred:   { name: 'Kuchyňa',  pos: [4.05, 2.25, 1.45], look: [4.62, 3.85], links: ['koberec', 'gauc'] },
  gauc:    { name: 'Z gauča',  pos: [5.20, 1.75, 1.05], look: [2.30, 2.05], links: ['koberec', 'stred'] },
  vstup:   { name: 'Od vstupu', pos: [1.65, 4.60, 1.50], look: [3.60, 1.20], links: ['koberec', 'postel'] },
  postel:  { name: 'Posteľ',   pos: [1.90, 1.55, 1.20], look: [0.75, 1.90], links: ['vstup'] },
};

// Panoráma má stred obrázka v smere +y z výkresu; plán (x, y, z) je vo webe (-y, z, -x).
const toWorld = (dx, dy, dz) => new THREE.Vector3(-dy, dz, -dx);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const el = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(80, 1, 0.05, 60);

const sphereGeo = new THREE.SphereGeometry(30, 96, 64);
sphereGeo.scale(-1, 1, 1);
const front = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false }));
const back = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ depthWrite: false }));
back.renderOrder = 0;
front.renderOrder = 1;
scene.add(back, front);

const markers = new THREE.Group();
scene.add(markers);
const ringGeo = new THREE.RingGeometry(0.14, 0.19, 48);
ringGeo.rotateX(-Math.PI / 2);
const discGeo = new THREE.CircleGeometry(0.19, 48);
discGeo.rotateX(-Math.PI / 2);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthTest: false });
const discMat = new THREE.MeshBasicMaterial({ color: 0x1d2329, transparent: true, opacity: 0.28, depthTest: false });

let yaw = 0, pitch = -0.08, fov = 80, velYaw = 0, velPitch = 0;
let current = null, needsRender = true, fade = 1, loadToken = 0;
const FOV_MIN = 32, FOV_MAX = 100;
const status = document.getElementById('status');
const bar = document.getElementById('bar');
const hint = document.getElementById('hint');
const buttons = {};
const textures = new Map();

const loader = new THREE.TextureLoader();
function loadTexture(id) {
  if (textures.has(id)) return textures.get(id);
  const p = new Promise((resolve, reject) => {
    loader.load(`pano/${id}.jpg?v=${VERSION}`, t => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.minFilter = THREE.LinearMipmapLinearFilter;
      t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      resolve(t);
    }, undefined, reject);
  });
  textures.set(id, p);
  return p;
}

function headingTo(id) {
  const s = SPOTS[id];
  // yaw 0 = stred panorámy (+y z výkresu), kladný yaw doprava (+x).
  return Math.atan2(s.look[0] - s.pos[0], s.look[1] - s.pos[1]);
}

function buildMarkers(id) {
  markers.clear();
  const s = SPOTS[id];
  for (const to of s.links) {
    const t = SPOTS[to];
    const p = toWorld(t.pos[0] - s.pos[0], t.pos[1] - s.pos[1], EYE_FLOOR + 0.01 - s.pos[2]);
    const m = new THREE.Group();
    m.position.copy(p);
    const disc = new THREE.Mesh(discGeo, discMat);
    const ring = new THREE.Mesh(ringGeo, ringMat);
    disc.renderOrder = ring.renderOrder = 3;
    disc.userData.to = ring.userData.to = to;
    m.add(disc, ring);
    markers.add(m);
  }
}

async function go(id, keepHeading) {
  if (id === current) return;
  const token = ++loadToken;
  status.hidden = false;
  status.textContent = 'Načítavam fotku…';
  Object.entries(buttons).forEach(([k, b]) => b.classList.toggle('on', k === id));
  let tex;
  try {
    tex = await loadTexture(id);
  } catch (e) {
    textures.delete(id);
    if (token === loadToken) status.textContent = 'Fotku sa nepodarilo načítať. Skontroluj pripojenie a skús znova.';
    return;
  }
  if (token !== loadToken) return;
  back.material.map = front.material.map || tex;
  back.material.needsUpdate = true;
  front.material.map = tex;
  front.material.needsUpdate = true;
  fade = 0;
  current = id;
  buildMarkers(id);
  if (!keepHeading) {
    yaw = headingTo(id);
    pitch = -0.08;
    velYaw = velPitch = 0;
    fov = defaultFov();
  }
  status.hidden = true;
  needsRender = true;
  // Dopredu pripraví miesta, kam sa dá prejsť, aby prechod bol okamžitý.
  SPOTS[id].links.forEach(l => loadTexture(l).catch(() => textures.delete(l)));
}

function defaultFov() {
  return camera.aspect < 1 ? 92 : 72;
}

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  needsRender = true;
}

Object.entries(SPOTS).forEach(([id, s]) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = s.name;
  b.addEventListener('click', () => go(id));
  bar.append(b);
  buttons[id] = b;
});
const link3d = document.createElement('a');
link3d.className = 'btn';
link3d.href = './3d.html';
link3d.textContent = 'Voľný 3D model';
bar.append(link3d);

// --- ovládanie prstami a myšou -----------------------------------------------------------------------

const pointers = new Map();
let pinchDist = 0, pinchFov = fov, moved = 0, lastT = 0;
const ray = new THREE.Raycaster();

el.addEventListener('pointerdown', e => {
  el.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0;
  velYaw = velPitch = 0;
  lastT = performance.now();
  hint.style.opacity = 0;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    pinchFov = fov;
  }
});

el.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (pointers.size === 1) {
    // Bod pod prstom sa drží pod prstom pri každom priblížení.
    const k = THREE.MathUtils.degToRad(fov) / window.innerHeight;
    const now = performance.now(), dt = Math.max(now - lastT, 8);
    yaw -= dx * k;
    pitch += dy * k;
    velYaw = -dx * k / dt;
    velPitch = dy * k / dt;
    lastT = now;
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) fov = THREE.MathUtils.clamp(pinchFov * pinchDist / dist, FOV_MIN, FOV_MAX);
  }
  needsRender = true;
});

function endPointer(e) {
  const had = pointers.delete(e.pointerId);
  if (!had) return;
  if (performance.now() - lastT > 60) velYaw = velPitch = 0;
  if (moved < 8 && pointers.size === 0) {
    const v = new THREE.Vector2(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(v, camera);
    const hit = ray.intersectObjects(markers.children, true)[0];
    if (hit && hit.object.userData.to) go(hit.object.userData.to);
  }
}
el.addEventListener('pointerup', endPointer);
el.addEventListener('pointercancel', endPointer);
el.addEventListener('wheel', e => {
  e.preventDefault();
  fov = THREE.MathUtils.clamp(fov + e.deltaY * 0.04, FOV_MIN, FOV_MAX);
  needsRender = true;
}, { passive: false });

window.addEventListener('resize', resize);
resize();

const MAX_PITCH = Math.PI / 2 - 0.02;
const target = new THREE.Vector3();
let prev = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(now - prev, 50);
  prev = now;
  if (pointers.size === 0 && (Math.abs(velYaw) > 1e-5 || Math.abs(velPitch) > 1e-5)) {
    yaw += velYaw * dt;
    pitch += velPitch * dt;
    const damp = Math.pow(0.992, dt);
    velYaw *= damp;
    velPitch *= damp;
    needsRender = true;
  }
  if (fade < 1) {
    fade = Math.min(1, fade + dt / 320);
    front.material.opacity = fade;
    needsRender = true;
  }
  if (!needsRender) return;
  pitch = THREE.MathUtils.clamp(pitch, -MAX_PITCH, MAX_PITCH);
  camera.fov = fov;
  camera.updateProjectionMatrix();
  const cp = Math.cos(pitch);
  target.copy(toWorld(Math.sin(yaw) * cp, Math.cos(yaw) * cp, Math.sin(pitch)));
  camera.lookAt(target);
  renderer.render(scene, camera);
  needsRender = false;
});

window.viewer = { go, get current() { return current; }, get yaw() { return yaw; }, get fov() { return fov; }, renderer };
const start = new URLSearchParams(location.search).get('miesto');
go(SPOTS[start] ? start : 'koberec');
</script>
</body>
</html>
